name: Background launcher
on:
  pull_request:
    paths: ['tools/start_background.ps1', 'tools/hidden_console.ps1', 'build_desktop.ps1', 'tools/checks/agent.ps1', 'tests/desktop/check_background_launcher.py', 'tools/checks/background.ps1', '.github/workflows/background-launcher.yml']
  push:
    branches: [main]
    paths: ['tools/start_background.ps1', 'tools/hidden_console.ps1', 'build_desktop.ps1', 'tools/checks/agent.ps1', 'tests/desktop/check_background_launcher.py', 'tools/checks/background.ps1', '.github/workflows/background-launcher.yml']
permissions:
  contents: read
jobs:
  hidden-descendants:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.25.0
      - name: Verify nested console visibility through a Windows venv
        shell: pwsh
        run: ./tools/checks/background.ps1
