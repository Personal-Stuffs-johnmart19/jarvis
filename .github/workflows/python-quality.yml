name: Python services
on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'actions/**'
      - 'local_mode/**'
      - 'apps/desktop/src/locales/**'
      - 'tests/**'
      - 'tools/ci/**'
      - 'tools/local_worker.py'
      - 'tools/setup/**'
      - 'requirements/**'
      - '*.cmd'
      - '*.bat'
      - 'setup_local.ps1'
      - 'start_*.ps1'
      - 'launch_local.py'
      - 'start_local.py'
      - 'pyproject.toml'
      - '.github/workflows/python-quality.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'actions/**'
      - 'local_mode/**'
      - 'apps/desktop/src/locales/**'
      - 'tests/**'
      - 'tools/ci/**'
      - 'tools/local_worker.py'
      - 'tools/setup/**'
      - 'requirements/**'
      - '*.cmd'
      - '*.bat'
      - 'setup_local.ps1'
      - 'start_*.ps1'
      - 'launch_local.py'
      - 'start_local.py'
      - 'pyproject.toml'
      - '.github/workflows/python-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-services-${{ github.ref }}
  cancel-in-progress: true
jobs:
  services:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      JARVIS_QA_ALLOW_CLOUD: '0'
      JARVIS_DESKTOP_TEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install focused test environment
        run: python -m pip install -r requirements/ci.txt
      - name: Install pinned dependency resolver
        run: python -m pip install uv==0.12.23
      - name: Validate runtime lockfiles without installing model frameworks
        shell: pwsh
        run: ./tools/ci/resolve-python-lockfiles.ps1
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Shared services, speech controls, catalogues and RAG regressions
        shell: pwsh
        run: ./tools/ci/test-python-services.ps1
