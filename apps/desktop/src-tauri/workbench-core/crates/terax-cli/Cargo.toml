[package]
name = "terax-cli"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "terax_cli"
path = "src/lib.rs"

[[bin]]
name = "terax-cli"
path = "src/main.rs"

[dependencies]
dirs = "7"
serde_json = "1"
terax-control-protocol = { path = "../terax-control-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
